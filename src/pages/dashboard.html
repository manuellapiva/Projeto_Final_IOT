<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard IoT - ESP32 + Mosquitto</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
  <link rel="stylesheet" href="../styles/dashboard.css">
  
</head>

<body>

  <main class="dashboard">

    <section class="dashboard-header">

      <div>
        <span class="subtitle">MONITORAMENTO IOT</span>
        <h1>Dashboard em Tempo Real</h1>
        <p>Acompanhe os dados dos seus sensores ESP32.</p>
      </div>

      <div id="status" class="status disconnected">
        <span id="status-text">Desconectado</span>
      </div>

    </section>

    <section class="cards-container">

      <div class="card temperature-card">

        <div class="card-top">
          <div class="icon-box temperature-icon">🌡</div>
          <span class="card-label">SENSOR 01</span>
        </div>

        <h3>Temperatura</h3>

        <div class="value">
          <span id="temp">--</span>
          <span class="unit">°C</span>
        </div>
      </div>

      <div class="card humidity-card">

        <div class="card-top">
          <div class="icon-box humidity-icon">💧</div>
          <span class="card-label">SENSOR 02</span>
        </div>

        <h3>Umidade</h3>

        <div class="value">
          <span id="hum">--</span>
          <span class="unit">%</span>
        </div>
      </div>

      <div class="card air-card">

        <div class="card-top">
          <div class="icon-box air-icon">💨</div>
          <span class="card-label">SENSOR 03</span>
        </div>

        <h3>Qualidade do Ar</h3>

        <div class="value">
          <span id="air">--</span>
        </div>     
      </div>

        <div class="banner">
          <div class="banner-content">
            <h2>Projeto IoT SESI SENAI Grupo 2</h2>
          </div>
        </div>

    </section>

  </main>

</body>
</html>
